<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clawfall Living Gardens</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#273653,#080f20);color:#f4e8d7;font:16px system-ui}main{max-width:600px;padding:32px;text-align:center}h1{letter-spacing:5px}p{color:#b7cbdc;line-height:1.7}</style><main><h1>CLAWFALL</h1><p id="status">Loading Living Gardens...</p><noscript>Please enable JavaScript to play.</noscript></main><script src="combat-upgrade.js"></script><script src="animation-upgrade.js"></script><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(async n=>{const r=await fetch('game-part-'+n+'.txt');if(!r.ok)throw Error('The game files could not load. Please reload later.');return r.text()}));const html=parts.join('');const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');if(hash!=='2e0db9871aa7d147d28a90e3348813aad01d43f63102763dc3b97866c42b9958')throw Error('The base game files are incomplete or outdated.');if(typeof window.upgradeClawfall!=='function'||typeof window.animateClawfall!=='function')throw Error('Game update did not load. Please reload.');const game=window.animateClawfall(window.upgradeClawfall(html));document.open();document.write(game);document.close()}catch(e){document.getElementById('status').textContent=e.message}})();</script></html>
